<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理後台 — 迅頁</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand-mark" href="/app">迅頁 <small>管理後台</small></a>
    <div class="top-actions">
      <span class="user-chip" id="user-chip"></span>
      <a href="/app">返回工作台</a>
      <button class="btn btn-sm btn-secondary" type="button" id="btn-logout">登出</button>
    </div>
  </header>
  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>平台使用概況</h1>
        <p class="muted">查看所有註冊使用者、已生成的網站與操作紀錄。時間皆為台灣時間（Asia/Taipei）。</p>
      </div>
      <button class="btn btn-secondary" type="button" id="btn-refresh">重新整理</button>
    </div>
    <div class="stats" id="stats"></div>

    <section class="card admin-section">
      <h2>使用者</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名稱／電子郵件</th>
              <th>註冊時間</th>
              <th>最近登入</th>
              <th>網站數</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card admin-section">
      <h2>已生成的網站</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>網站名稱</th>
              <th>擁有者</th>
              <th>模板／風格</th>
              <th>建立時間</th>
              <th>發佈狀態</th>
              <th>檢視</th>
            </tr>
          </thead>
          <tbody id="sites-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card admin-section">
      <h2>活動紀錄</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>時間</th>
              <th>類型</th>
              <th>帳號</th>
              <th>說明</th>
            </tr>
          </thead>
          <tbody id="activity-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/js/common.js"></script>
  <script src="/js/templates.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
